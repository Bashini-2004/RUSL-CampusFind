 <!-- Main Form -->
  <main>
    <h2>Report Lost or Found Items</h2>
    <center><p> Please provide accurate details about the item.</center></p>
    <form class="report-form">
   <div class="radio-top">
  <label><input type="radio" name="reportType" value="lost"> I lost an item</label>
  <label><input type="radio" name="reportType" value="found"> I found an item</label>
</div>


      <label>Item Name*:
        <input type="text" name="itemName" required placeholder="Enter Item Name">
      </label>

      <label>Category*:
        <select name="category" required>
          <option value="">Select Category</option>
          <option>Books</option>
          <option>Electronics</option>
          <option>Clothing</option>
          <option>Accessories</option>
        </select>
      </label>

      <label>Description*:
        <textarea name="description" required placeholder="Provide details about the item"></textarea>
      </label>

      <label>Date Lost*:
        <input type="date" name="dateLost" required>
      </label>

      <label>Location*:
        <select name="location" required>
          <option value="">Where did you lose the item?</option>
          <option>Library</option>
          <option>Cafeteria</option>
          <option>Lecture Hall</option>
          <option>Playground</option>
        </select>
      </label>

      <label>Time (Approx.):
        <input type="time" name="time">
      </label>

      <label>Upload Image:
        <input type="file" name="image" accept="image/*">
      </label>

      <label>Contact Email*:
        <input type="email" name="email" required placeholder="Enter your email">
      </label>

      <p  class="note"> <b>Note: Your contact details will only be used to return the item to you.</b></p>
      <center>
      <button type="submit"> Submit Report</button>
      </center>
    </form>
  </main>
